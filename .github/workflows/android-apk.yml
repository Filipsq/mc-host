# Builds the Android app (android/, a Trusted Web Activity that opens mchosting.pl)
# whenever it changes on a work branch. The result is UNSIGNED: it is committed back
# to android/dist/ and signed outside GitHub with the key only the owner keeps,
# then published as public/pobierz/mchosting.apk. The key never goes to GitHub.
name: Android APK

on:
  push:
    branches-ignore: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml", "!android/dist/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Commit the APK back to the branch
        run: |
          mkdir -p android/dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add android/dist
          git commit -m "Android: unsigned APK from ${GITHUB_SHA::7} [skip ci]" || exit 0
          git push
