<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f14">
<title>MCHosting · Brak połączenia</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; color: #e8eef5; font-family: system-ui, -apple-system, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 22px; margin: 20px 0 8px; }
  p { color: #94a3b8; margin: 0 0 4px; line-height: 1.5; }
  button { margin-top: 20px; font: inherit; font-weight: 700; color: #0a1a06; background: #5bc236; border: 0; border-bottom: 4px solid #3f8f22; border-radius: 9px; padding: 12px 22px; }
</style>
</head>
<body>
<main>
  <div>
    <img src="/icons/icon-192.png" alt="">
    <h1>Brak połączenia z internetem</h1>
    <p>Twoje serwery działają dalej. Panel wróci, gdy telefon znów będzie online.</p>
    <p lang="en">You're offline. Your servers keep running.</p>
    <button type="button" onclick="location.reload()">Spróbuj ponownie</button>
  </div>
</main>
</body>
</html>
